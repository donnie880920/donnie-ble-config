<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donnie BLE 雙服務藍芽鍵盤配置器</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { text-align: center; color: #38bdf8; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #94a3b8; margin-bottom: 25px; }
        .card { background-color: #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }
        .btn { background-color: #0284c7; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn:hover { background-color: #0369a1; }
        .btn-green { background-color: #16a34a; }
        .btn-green:hover { background-color: #15803d; }
        .btn-purple { background-color: #9333ea; }
        .btn-purple:hover { background-color: #7e22ce; }
        .btn-group { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .profile-tab { background-color: #334155; padding: 8px 16px; border-radius: 6px; cursor: pointer; display: inline-block; margin-right: 5px; }
        .profile-tab.active { background-color: #38bdf8; color: #0f172a; font-weight: bold; }
        .button-row { display: flex; align-items: center; justify-content: space-between; background-color: #0f172a; padding: 10px; border-radius: 8px; margin-bottom: 8px; }
        .btn-label { font-weight: bold; width: 100px; color: #e2e8f0; }
        select, input[type="text"] { background-color: #334155; color: white; border: 1px solid #475569; padding: 6px 10px; border-radius: 6px; }
        .mod-checkboxes label { margin-right: 10px; font-size: 14px; }
        #log { background-color: #000; color: #4ade80; padding: 10px; border-radius: 6px; height: 100px; overflow-y: auto; font-family: monospace; font-size: 12px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Donnie BLE 配置控制器</h1>
    <p class="subtitle">將 G4 接地進入設定模式後，即可在此讀取與同步設定</p>

    <div class="card">
        <div class="btn-group">
            <button class="btn" onclick="connectBLE()">1. 連線至 Donnie Config</button>
            <button class="btn btn-purple" onclick="readFromBoard()">📥 讀取板子資訊</button>
            <button class="btn btn-green" onclick="syncToBoard()">2. 同步資料至板子</button>
        </div>
        <div id="status">藍芽狀態：離線</div>
    </div>

    <div class="card">
        <div style="margin-bottom: 15px;">
            <div id="profileTabs"></div>
        </div>

        <div style="margin-bottom: 15px;">
            <label>方案名稱：</label>
            <input type="text" id="profileName" onchange="updateProfileName(this.value)" placeholder="輸入方案名稱..." style="width: 200px;">
        </div>

        <div id="buttonConfigs"></div>
    </div>

    <div class="card">
        <h3>系統日誌 (Log)</h3>
        <div id="log">等待連線中...<br></div>
    </div>
</div>

<script>
const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

let bleDevice, bleChar;
let currentProfileIdx = 0;

const btnNames = ["G3 (Up)", "G2 (方案-1)", "G1 (方案+1)", "G0 (Down)", "G5 (Func1)", "G6 (Func2)", "G7 (Func3)"];

let profiles = [
    {
        name: "預設通用方案",
        buttons: [
            { mod: 0, keys: [0x52] },
            { mod: 0, keys: [] },
            { mod: 0, keys: [] },
            { mod: 0, keys: [0x51] },
            { mod: 1, keys: [0x04] },
            { mod: 1, keys: [0x19] },
            { mod: 1, keys: [0x06] }
        ]
    }
];

function log(msg) {
    const l = document.getElementById("log");
    l.innerHTML += `[${new Date().toLocaleTimeString()}] ${msg}<br>`;
    l.scrollTop = l.scrollHeight;
}

async function connectBLE() {
    try {
        log("正在搜尋 Donnie Config...");
        bleDevice = await navigator.bluetooth.requestDevice({
            filters: [{ name: 'Donnie Config' }],
            optionalServices: [SERVICE_UUID]
        });

        const server = await bleDevice.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        bleChar = await service.getCharacteristic(CHARACTERISTIC_UUID);

        document.getElementById("status").innerHTML = "藍芽狀態：<span style='color:#4ade80;'>已連線 (Donnie Config)</span>";
        log("藍芽連線成功！");
    } catch (e) {
        log("連線失敗: " + e);
    }
}

async function readFromBoard() {
    if (!bleChar) { log("請先連線藍芽！"); return; }
    try {
        log("讀取板子記憶體設定中...");
        const value = await bleChar.readValue();
        const decoder = new TextDecoder('utf-8');
        const jsonStr = decoder.decode(value);
        profiles = JSON.parse(jsonStr);
        currentProfileIdx = 0;
        renderTabs();
        renderConfig();
        log("成功讀取板子資訊！已套用至網頁。");
    } catch (e) {
        log("讀取失敗: " + e);
    }
}

async function syncToBoard() {
    if (!bleChar) { log("請先連線藍芽！"); return; }
    try {
        const jsonStr = JSON.stringify(profiles);
        log("傳送設定資料中...");
        
        const chunkSize = 100;
        for (let i = 0; i < jsonStr.length; i += chunkSize) {
            const chunk = jsonStr.substring(i, i + chunkSize);
            await bleChar.writeValue(new TextEncoder().encode(chunk));
            await new Promise(r => setTimeout(r, 50));
        }
        await bleChar.writeValue(new TextEncoder().encode("END"));
        log("同步完成！完成後請放開 G4 恢復藍芽鍵盤模式。");
    } catch (e) {
        log("同步失敗: " + e);
    }
}

function renderTabs() {
    const tabDiv = document.getElementById("profileTabs");
    tabDiv.innerHTML = "";
    profiles.forEach((p, idx) => {
        const span = document.createElement("span");
        span.className = `profile-tab ${idx === currentProfileIdx ? 'active' : ''}`;
        span.innerText = p.name || `方案 ${idx + 1}`;
        span.onclick = () => { currentProfileIdx = idx; renderTabs(); renderConfig(); };
        tabDiv.appendChild(span);
    });
}

function updateProfileName(val) {
    profiles[currentProfileIdx].name = val;
    renderTabs();
}

function renderConfig() {
    const curP = profiles[currentProfileIdx];
    document.getElementById("profileName").value = curP.name || "";
    const container = document.getElementById("buttonConfigs");
    container.innerHTML = "";

    btnNames.forEach((name, bIdx) => {
        const btnData = curP.buttons[bIdx] || { mod: 0, keys: [] };
        const row = document.createElement("div");
        row.className = "button-row";

        row.innerHTML = `
            <span class="btn-label">${name}</span>
            <div class="mod-checkboxes">
                <label><input type="checkbox" ${btnData.mod & 1 ? 'checked' : ''} onchange="updateMod(${bIdx}, 1, this.checked)"> Ctrl</label>
                <label><input type="checkbox" ${btnData.mod & 2 ? 'checked' : ''} onchange="updateMod(${bIdx}, 2, this.checked)"> Shift</label>
                <label><input type="checkbox" ${btnData.mod & 4 ? 'checked' : ''} onchange="updateMod(${bIdx}, 4, this.checked)"> Alt</label>
                <label><input type="checkbox" ${btnData.mod & 8 ? 'checked' : ''} onchange="updateMod(${bIdx}, 8, this.checked)"> Win</label>
            </div>
            <input type="text" value="${(btnData.keys || []).map(k => '0x' + k.toString(16).padStart(2,'0')).join(',')}" 
                   onchange="updateKeys(${bIdx}, this.value)" placeholder="例: 0x04" style="width: 120px;">
        `;
        container.appendChild(row);
    });
}

function updateMod(bIdx, bit, checked) {
    if (checked) profiles[currentProfileIdx].buttons[bIdx].mod |= bit;
    else profiles[currentProfileIdx].buttons[bIdx].mod &= ~bit;
}

function updateKeys(bIdx, val) {
    const keys = val.split(',').map(s => parseInt(s.trim(), 16)).filter(n => !isNaN(n));
    profiles[currentProfileIdx].buttons[bIdx].keys = keys;
}

renderTabs();
renderConfig();
</script>
</body>
</html>
